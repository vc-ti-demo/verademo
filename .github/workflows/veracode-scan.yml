name: Veracode Static Analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '8'
      - name: Build WAR with Maven
        working-directory: app
        run: mvn clean package -Dproject.build.outputTimestamp=
      - uses: actions/upload-artifact@v4
        with:
          name: verademo.war
          path: app/target/verademo.war

  veracode-scan:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/download-artifact@v4
        with:
          name: verademo.war
          path: app/target

      - name: Veracode Upload And Scan
        uses: veracode/veracode-uploadandscan-action@0.2.11
        with:
          appname: 'Jason Bates Technical Panel'
          createprofile: false
          createsandbox: true
          sandboxname: 'Github'
          filepath: 'app/target/verademo.war'
          vid: '${{ secrets.VERACODE_API_ID }}'
          vkey: '${{ secrets.VERACODE_API_KEY }}'
          criticality: 'VeryLow'
          scantimeout: 60

  pipeline_scan:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/download-artifact@v4
        with:
          name: verademo.war
      - uses: veracode/Veracode-pipeline-scan-action@v1.0.25
        with:
          vid: '${{ secrets.VERACODE_API_ID }}'
          vkey: '${{ secrets.VERACODE_API_KEY }}'
          token: '${{ secrets.GITHUB_TOKEN }}'
          file: 'verademo.war'
          fail_build: false
          artifact_name: 'Veracode Pipeline-Scan Results'

  veracode_fix:
    needs: pipeline_scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/download-artifact@v4
        with:
          name: Veracode Pipeline-Scan Results
      - uses: Veracode/veracode-fix@v1.0.6
        with:
          vid: '${{ secrets.VERACODE_API_ID }}'
          vkey: '${{ secrets.VERACODE_API_KEY }}'
          inputFile: filtered_results.json
          fixType: batch
          files: changed
          prComment: true

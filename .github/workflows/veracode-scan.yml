name: Veracode Static Analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '8'

      - name: Build with Maven
        run: mvn -B package --file app/pom.xml -Dproject.build.outputTimestamp=

      - uses: actions/upload-artifact@v7
        with:
          name: 'verademo.war'
          path: 'app/target/verademo.war'

  veracode-scan:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: verademo.war
          path: app/target

      - name: Veracode Upload And Scan
        uses: veracode/veracode-uploadandscan-action@0.2.11
        with:
          appname: 'Jason Bates Technical Panel'
          createprofile: false
          createsandbox: false
          sandboxname: 'Github'
          filepath: 'app/target/verademo.war'
          vid: '${{ secrets.VERACODE_API_ID }}'
          vkey: '${{ secrets.VERACODE_API_KEY }}'
          criticality: 'VeryHigh'

  pipeline_scan:
    needs: build
    runs-on: ubuntu-latest
    name: Veracode Pipeline Scan
    steps:
      - name: checkout repo
        uses: actions/checkout@v7

      - name: get archive
        uses: actions/download-artifact@v8
        with:
          name: verademo.war

      - name: pipeline-scan action step
        uses: veracode/Veracode-pipeline-scan-action@v1.0.25
        with:
          vid: '${{ secrets.VERACODE_API_ID }}'
          vkey: '${{ secrets.VERACODE_API_KEY }}'
          file: 'verademo.war'
          debug: 1
          fail_build: false

      - name: Upload Pipeline Scan results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: 'Veracode Pipeline-Scan Results'
          path: |
            results.json
            filtered_results.json

  veracode_fix:
    needs: pipeline_scan
    runs-on: ubuntu-latest
    name: Veracode Fix
    steps:
      - name: checkout repo
        uses: actions/checkout@v7

      - name: get flaw file
        uses: actions/download-artifact@v8
        with:
          name: Veracode Pipeline-Scan Results

      - name: Create fixes from static findings
        id: convert
        uses: Veracode/veracode-fix@v1.0.6
        with:
          inputFile: filtered_results.json
          vid: '${{ secrets.VERACODE_API_ID }}'
          vkey: '${{ secrets.VERACODE_API_KEY }}'
          prComment: true
          fixType: batch
